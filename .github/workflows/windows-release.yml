name: Windows Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verdant-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automated tests
        run: npm test
      - name: Vite bundle
        run: npm run build
      - name: Build Electron NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Assemble release ZIPs, checksums, verify
        shell: pwsh
        run: |
          python scripts/make-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release ZIP assembly failed' }
          $version = node -p "require('./package.json').version"
          node scripts/verify-release.mjs "VERDANT_v${version}_PROJECT.zip" "VERDANT_v${version}_TEXTURES_1K.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Source and content verification failed' }
          node scripts/verify-desktop-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron update metadata verification failed' }
      - name: Publish GitHub Release only after checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $api = "repos/$env:GITHUB_REPOSITORY/releases"
          # Draft tags are not resolvable as public releases. Use numeric IDs for every draft operation.
          $raw = gh api "$api`?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release list' }
          $found = @(($raw | ConvertFrom-Json) | Where-Object { $_.tag_name -eq $tag })
          if ($found.Count -gt 1) { throw 'Ambiguous release tag' }
          $release = if ($found.Count -eq 1) { $found[0] } else { $null }
          if ($null -ne $release -and -not $release.draft) {
            Write-Host "Release $tag is published: never replace its assets"
            exit 0
          }
          if ($null -ne $release) {
            # Explicit recovery of this inspected, unpublished draft only. Both previous builds passed tests and feed verification.
            $recoveryTargets = @('6ae7d0062b00d9be01a8a8ac20d7f7e7759d761a', 'b8acc1e54197591613e9351d8b581b3d693c9820')
            $knownRecovery = $release.id -eq 415803529 -and $tag -eq 'v0.1.10006' -and $release.target_commitish -in $recoveryTargets
            if ($release.author.login -ne 'github-actions[bot]' -or $release.prerelease -or ($release.target_commitish -ne $env:GITHUB_SHA -and -not $knownRecovery)) {
              throw 'An unrelated draft exists; inspect it before retrying'
            }
          }
          $exeFiles = @(Get-ChildItem -Path dist-release -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          if ($exeFiles.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $latest = Join-Path (Get-Location).Path 'dist-release/latest.yml'
          $blockmaps = @(Get-ChildItem -Path dist-release -Filter '*.blockmap' -File | ForEach-Object { $_.FullName })
          if ($blockmaps.Count -ne 1 -or -not (Test-Path -LiteralPath $latest)) { throw 'Missing Electron update metadata' }
          $assets = @($exeFiles) + @($blockmaps) + @(
            $latest,
            (Join-Path (Get-Location).Path ("VERDANT_v" + $version + "_PROJECT.zip")),
            (Join-Path (Get-Location).Path ("VERDANT_v" + $version + "_TEXTURES_1K.zip")),
            (Join-Path (Get-Location).Path 'SHA256SUMS.txt')
          )
          if ($null -eq $release) {
            $raw = gh api --method POST $api -f tag_name=$tag -f target_commitish=$env:GITHUB_SHA -F draft=true -F prerelease=false -f name="VERDANT $version" -F body=@CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft' }
            $release = $raw | ConvertFrom-Json
          }
          if ($null -eq $release -or -not $release.draft) { throw 'Draft is not available' }
          $releaseApi = "$api/$($release.id)"
          $raw = gh api --method PATCH $releaseApi -f target_commitish=$env:GITHUB_SHA -F draft=true
          if ($LASTEXITCODE -ne 0) { throw 'Could not set checked draft target' }
          $release = $raw | ConvertFrom-Json
          $uploadBase = $release.upload_url.Split('{')[0]
          $expectedBase = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets"
          if ($uploadBase -ne $expectedBase) { throw 'Unexpected upload endpoint' }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $oldAssets = @($release.assets | Where-Object { $_.name -eq $name })
            foreach ($old in $oldAssets) {
              gh api --method DELETE "$api/assets/$($old.id)"
              if ($LASTEXITCODE -ne 0) { throw "Cannot replace unpublished asset $name" }
            }
            $upload = $uploadBase + '?name=' + [Uri]::EscapeDataString($name)
            $size = (Get-Item -LiteralPath $file).Length
            gh api --method POST $upload --input $file -H 'Content-Type: application/octet-stream' -H "Content-Length: $size" --silent
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $name" }
            Write-Host "Uploaded draft asset: $name"
          }
          $raw = gh api $releaseApi
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read draft by numeric ID' }
          $release = $raw | ConvertFrom-Json
          if (-not $release.draft -or $release.tag_name -ne $tag -or $release.target_commitish -ne $env:GITHUB_SHA) { throw 'Draft target changed during upload' }
          if (@($release.assets).Count -ne $assets.Count) { throw 'Unexpected asset count' }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $match = @($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' })
            $size = (Get-Item -LiteralPath $file).Length
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($match.Count -ne 1 -or $match[0].size -ne $size -or $match[0].digest -ne $digest) { throw "Uploaded asset verification failed: $name" }
          }
          gh api --method PATCH $releaseApi -F draft=false -F prerelease=false -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified draft' }
          $raw = gh api $releaseApi
          if ($LASTEXITCODE -ne 0) { throw 'Cannot confirm publication' }
          $published = $raw | ConvertFrom-Json
          if ($published.draft -or $published.prerelease -or $published.tag_name -ne $tag) { throw 'Incorrect final release state' }
          Write-Host "VERDANT UPDATE CHANNEL READY: $($published.html_url)"
