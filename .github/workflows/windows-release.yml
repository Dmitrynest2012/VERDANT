name: Windows Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verdant-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Automated tests
        run: npm test
      - name: Vite bundle
        run: npm run build
      - name: Build Electron NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Assemble release ZIPs, checksums, verify
        shell: pwsh
        run: |
          python scripts/make-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release ZIP assembly failed' }
          $version = node -p "require('./package.json').version"
          node scripts/verify-release.mjs "VERDANT_v${version}_PROJECT.zip" "VERDANT_v${version}_TEXTURES_1K.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Source and content verification failed' }
          node scripts/verify-desktop-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron update metadata verification failed' }
      - name: Publish GitHub Release only after checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-GitHub($endpoint) {
            $raw = gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub read failed: $endpoint" }
            return ($raw | ConvertFrom-Json)
          }
          function Write-GitHub($method, $endpoint, $body) {
            $temp = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString() + '.json')
            try {
              $body | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $temp -Encoding utf8
              $raw = gh api --method $method $endpoint --input $temp
              if ($LASTEXITCODE -ne 0) { throw "GitHub write failed: $method $endpoint" }
              return ($raw | ConvertFrom-Json)
            } finally { Remove-Item -LiteralPath $temp -ErrorAction SilentlyContinue }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = 'v' + $version
          $repoApi = 'repos/' + $env:GITHUB_REPOSITORY
          $api = $repoApi + '/releases'
          $all = @(Read-GitHub ($api + '?per_page=100'))
          $found = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($found.Count -gt 1) { throw 'Ambiguous version tag' }
          $release = if ($found.Count -eq 1) { $found[0] } else { $null }
          if ($null -ne $release -and -not $release.draft) {
            Write-Host "Release $tag is already published; never overwrite it"
            exit 0
          }
          if ($null -eq $release -and $tag -eq 'v0.1.10006') {
            # Exact draft inspected after upload verification was blocked by an untagged draft URL.
            $recovery = @($all | Where-Object { $_.id -eq 415808916 })
            if ($recovery.Count -eq 1 -and $recovery[0].draft -and $recovery[0].author.login -eq 'github-actions[bot]' -and $recovery[0].target_commitish -eq 'a787e019e5fd718528c22381541f6575ed0060f7' -and $recovery[0].name -eq 'VERDANT 0.1.10006') {
              $release = $recovery[0]
            }
          }
          if ($null -ne $release) {
            $knownRecovery = $release.id -eq 415808916 -and $tag -eq 'v0.1.10006' -and $release.target_commitish -eq 'a787e019e5fd718528c22381541f6575ed0060f7'
            if (-not $release.draft -or $release.prerelease -or $release.author.login -ne 'github-actions[bot]' -or ($release.target_commitish -ne $env:GITHUB_SHA -and -not $knownRecovery)) { throw 'Unrelated draft: inspect before modifying it' }
          }
          # Establish an actual Git tag before assigning it to a draft. Do not mutate any existing version tag.
          $refs = @(Read-GitHub ($repoApi + '/git/matching-refs/tags/' + $tag))
          $ref = @($refs | Where-Object { $_.ref -eq ('refs/tags/' + $tag) })
          if ($ref.Count -eq 0) {
            $null = Write-GitHub 'POST' ($repoApi + '/git/refs') @{ ref = ('refs/tags/' + $tag); sha = $env:GITHUB_SHA }
          } elseif ($ref.Count -ne 1 -or $ref[0].object.sha -ne $env:GITHUB_SHA) { throw 'Version tag already points to another commit' }
          $exeFiles = @(Get-ChildItem dist-release -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          $blockmaps = @(Get-ChildItem dist-release -Filter '*.blockmap' -File | ForEach-Object { $_.FullName })
          if ($exeFiles.Count -ne 1 -or $blockmaps.Count -ne 1) { throw 'Expected one installer and blockmap' }
          $assets = @($exeFiles) + @($blockmaps) + @(
            (Join-Path (Get-Location).Path 'dist-release/latest.yml'),
            (Join-Path (Get-Location).Path ('VERDANT_v' + $version + '_PROJECT.zip')),
            (Join-Path (Get-Location).Path ('VERDANT_v' + $version + '_TEXTURES_1K.zip')),
            (Join-Path (Get-Location).Path 'SHA256SUMS.txt')
          )
          $body = @{ tag_name=$tag; target_commitish=$env:GITHUB_SHA; draft=$true; prerelease=$false; name=('VERDANT ' + $version); body=(Get-Content CHANGELOG.md -Raw) }
          if ($null -eq $release) { $release = Write-GitHub 'POST' $api $body }
          else { $release = Write-GitHub 'PATCH' ($api + '/' + $release.id) $body }
          $releaseApi = $api + '/' + $release.id
          if (-not $release.draft -or $release.tag_name -ne $tag -or $release.target_commitish -ne $env:GITHUB_SHA) { throw ('Draft identity mismatch: ' + ($release | Select-Object id,tag_name,target_commitish,draft | ConvertTo-Json -Compress)) }
          $uploadBase = $release.upload_url.Split('{')[0]
          $expectedBase = 'https://uploads.github.com/' + $repoApi + '/releases/' + $release.id + '/assets'
          if ($uploadBase -ne $expectedBase) { throw 'Unexpected upload endpoint' }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            foreach ($old in @($release.assets | Where-Object { $_.name -eq $name })) {
              gh api --method DELETE ($api + '/assets/' + $old.id) --silent
              if ($LASTEXITCODE -ne 0) { throw ('Cannot replace draft asset: ' + $name) }
            }
            $size = (Get-Item -LiteralPath $file).Length
            $upload = $uploadBase + '?name=' + [Uri]::EscapeDataString($name)
            gh api --method POST $upload --input $file -H 'Content-Type: application/octet-stream' -H "Content-Length: $size" --silent
            if ($LASTEXITCODE -ne 0) { throw ('Upload failed: ' + $name) }
            Write-Host "Uploaded: $name"
          }
          $release = Read-GitHub $releaseApi
          if (-not $release.draft -or $release.tag_name -ne $tag -or $release.target_commitish -ne $env:GITHUB_SHA) { throw 'Draft identity changed during upload' }
          if (@($release.assets).Count -ne $assets.Count) { throw 'Unexpected asset count' }
          foreach ($file in $assets) {
            $name = [IO.Path]::GetFileName($file)
            $match = @($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' })
            $size = (Get-Item -LiteralPath $file).Length
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($match.Count -ne 1 -or $match[0].size -ne $size -or $match[0].digest -ne $digest) { throw ('Asset integrity mismatch: ' + $name) }
          }
          # Always include tag_name when publishing a draft; do not let it fall back to an untagged identifier.
          $body.draft = $false
          $body.make_latest = 'true'
          $published = Write-GitHub 'PATCH' $releaseApi $body
          if ($published.draft -or $published.prerelease -or $published.tag_name -ne $tag) { throw 'Incorrect final release state' }
          Write-Host "VERDANT UPDATE CHANNEL READY: $($published.html_url)"
