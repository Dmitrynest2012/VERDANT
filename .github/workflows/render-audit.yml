name: Render Audit
on:
  push:
    branches: ['qa/render-fixes-0.1.10008']
permissions:
  contents: write
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa-prepare-release.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: xvfb-run -a node scripts/render-regression.mjs
      - name: Record reviewed release metadata only on QA branch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/qa/render-fixes-0.1.10008
          git add package.json src/main.js index.html public/textures/README.md README.md CHANGELOG.md scripts/release-files.json docs/PROJECT_RULES.md docs/ATMOSPHERE_RENDERING.md docs/WATER_SYSTEM.md docs/WORLD_STREAMING.md docs/CURRENT_TASKS.md docs/GRASS_VARIATION.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: synchronize verified 0.1.10008 metadata and rendering documentation'
            git push origin HEAD:refs/heads/qa/render-fixes-0.1.10008
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-evidence
          path: qa-results/
          retention-days: 7
          if-no-files-found: warn
